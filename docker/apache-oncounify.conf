ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/oncounify
    Alias       /panel/   /var/www/oncounify/panel/
    ScriptAlias /cgi-bin/ /var/www/oncounify/cgi-bin/
    RedirectMatch ^/$ /panel/search.html

    PassEnv ONCOUNIFY_DB
    SetEnv  ONCOUNIFY_CGI_URL  /cgi-bin
    SetEnv  ONCOUNIFY_HTML_URL /panel

    <Directory /var/www/oncounify>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/oncounify/cgi-bin>
        Options +ExecCGI
    </Directory>

    # HTTP Basic authentication is enabled by docker/entrypoint.sh when
    # /etc/oncounify/htpasswd is mounted.  Terminate TLS and single sign-on
    # in front of this container (docs/INSTALL.md).
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
